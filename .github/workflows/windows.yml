name: Windows installer and portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Synchronize dependency lock
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Lock resolution failed' }
          git diff --quiet -- package-lock.json
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Synchronize dependency lock for Bitora ScreenFlow"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not persist lock update; branch changed' }
          }
      - run: npm ci
      - name: Ensure FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem *.js,qa/*.cjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error: $($_.Name)" }
          }
      - run: npm test
      - name: Build Windows packages
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test app, installer and portable startup
        shell: pwsh
        run: |
          function Test-App($exe) {
            Write-Host "Testing startup: $exe"
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Startup timed out: $exe" }
            if ($p.ExitCode -ne 0) { throw "Startup failed ($($p.ExitCode)): $exe" }
          }
          Test-App "$pwd/release/win-unpacked/Bitora ScreenFlow.exe"
          $installer = (Get-ChildItem release/*Setup*.exe | Select-Object -First 1).FullName
          $portable = (Get-ChildItem release/*Portable*.exe | Select-Object -First 1).FullName
          Test-App $portable
          if (-not (Test-Path 'release/BitoraScreenFlow-Data/Settings')) { throw 'Portable settings folder missing' }
          $installDir = Join-Path $env:LOCALAPPDATA "Bitora 'Тест' #100%"
          Write-Host "Installing to: $installDir"
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          Get-ChildItem $installDir
          Test-App (Join-Path $installDir 'Bitora ScreenFlow.exe')
          $uninstaller = (Get-ChildItem "$installDir/Uninstall*.exe" | Select-Object -First 1).FullName
          if (-not $uninstaller) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
      - name: Functional desktop recording and screenshots
        shell: pwsh
        run: |
          $env:BITORA_TEST_OUTPUT = Join-Path $env:RUNNER_TEMP 'BitoraFunctional'
          $p = Start-Process -FilePath "$pwd/release/win-unpacked/Bitora ScreenFlow.exe" -ArgumentList '--functional-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Functional tests timed out' }
          if (Test-Path "$env:BITORA_TEST_OUTPUT/error.txt") { Get-Content "$env:BITORA_TEST_OUTPUT/error.txt" }
          if ($p.ExitCode -ne 0) { throw "Functional tests failed: $($p.ExitCode)" }
          Get-Content "$env:BITORA_TEST_OUTPUT/result.json"
      - name: Functional regression in Unicode and escaped install path
        shell: pwsh
        run: |
          $special = Join-Path $env:RUNNER_TEMP "Bitora 'Артур' #100%"
          Copy-Item -LiteralPath "$pwd/release/win-unpacked" -Destination $special -Recurse
          $env:BITORA_TEST_OUTPUT = Join-Path $env:RUNNER_TEMP 'BitoraPathRegression'
          $p = Start-Process -FilePath (Join-Path $special 'Bitora ScreenFlow.exe') -ArgumentList '--functional-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Path regression timed out' }
          if (Test-Path "$env:BITORA_TEST_OUTPUT/error.txt") { Get-Content "$env:BITORA_TEST_OUTPUT/error.txt" }
          if ($p.ExitCode -ne 0) { throw "Path regression failed: $($p.ExitCode)" }
          $result = Get-Content "$env:BITORA_TEST_OUTPUT/result.json" -Raw | ConvertFrom-Json
          $result | ConvertTo-Json -Depth 5
          if (-not $result.normalizedPageAccepted) { throw 'Normalized path was not accepted' }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bitora-ScreenFlow-Windows
          path: |
            release/*Setup*.exe
            release/*Portable*.exe
            release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target (git rev-parse HEAD) --title "Bitora ScreenFlow $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag (Get-ChildItem release/*Setup*.exe).FullName (Get-ChildItem release/*Portable*.exe).FullName release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
